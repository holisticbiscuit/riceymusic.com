name = "ricey-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://riceymusic.com,https://www.riceymusic.com,http://localhost:5173,http://localhost:4173"
# Before / After uploads commit here; a push to this branch redeploys the site.
GITHUB_REPO = "holisticbiscuit/riceymusic.com"
GITHUB_BRANCH = "master"
# Contact form enquiries are emailed here (needs Email Routing on riceymusic.com, with this
# address verified as a destination).
CONTACT_TO = "oliverraiss@pm.me"
CONTACT_FROM = "website@riceymusic.com"

# Created with `npx wrangler kv namespace create CREDITS`.
[[kv_namespaces]]
binding = "CREDITS"
id = "bbe400e1442b4e61903009d426466f70"

# Secrets, set with `npx wrangler secret put <NAME>` (never committed):
#   ADMIN_USER, ADMIN_PASS, TOKEN_SECRET, GITHUB_TOKEN

# Lets the Worker email contact-form enquiries. Only works once Email Routing is enabled for
# riceymusic.com in the Cloudflare dashboard and CONTACT_TO is a verified destination.
[[send_email]]
name = "EMAIL"
destination_address = "oliverraiss@pm.me"
